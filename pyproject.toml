[project]
name = "scraper-pipeline"
version = "0.1.0"
description = "A Python scraping pipeline that notices when it breaks, built around output-quality monitoring rather than exit codes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marvellous Bamisaye" }]

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "tenacity>=8.3",
    "typer>=0.12",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
scraper = "scraper_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
